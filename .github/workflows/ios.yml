name: iOS build

on:
  push:
    branches-ignore: [ci-screenshots]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only used to publish screenshots to the ci-screenshots branch

jobs:
  build:
    name: Test, build & screenshot
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: app.tide.Tide
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest Xcode
        run: |
          BEST=""; BEST_VERSION="0"
          for app in /Applications/Xcode*.app; do
            v=$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)
            echo "$app -> $v"
            if [ "$(printf '%s\n%s\n' "$BEST_VERSION" "$v" | sort -V | tail -1)" = "$v" ]; then
              BEST="$app"; BEST_VERSION="$v"
            fi
          done
          sudo xcode-select -s "$BEST"
          xcodebuild -version
          MAJOR=${BEST_VERSION%%.*}
          echo "XCODE_MAJOR=$MAJOR" >> "$GITHUB_ENV"
          if [ "$MAJOR" -lt 27 ]; then
            # CI-only: build and test against the newest SDK the runner has.
            # The committed project keeps targeting iOS 27.
            echo "::warning::Runner has no Xcode 27 (newest is $BEST_VERSION). Testing against iOS $MAJOR; the project itself targets iOS 27."
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 27.0;/IPHONEOS_DEPLOYMENT_TARGET = $MAJOR.0;/" Tide.xcodeproj/project.pbxproj
            sed -i '' "s/.iOS(\"27.0\")/.iOS(\"$MAJOR.0\")/" Packages/TideKit/Package.swift
          fi
          xcrun simctl list runtimes

      - name: TideKit unit tests
        run: swift test --package-path Packages/TideKit

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devices.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m or int(m.group(1)) < int(os.environ["XCODE_MAJOR"]):
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in items:
                  name = d["name"]
                  if not name.startswith("iPhone"):
                      continue
                  score = (version, "Pro" in name and "Max" not in name, name)
                  if best is None or score > best[0]:
                      best = (score, d["udid"], name)
          if best is None:
              sys.exit("No matching iPhone simulator available")
          print(best[1])
          print(f"Using {best[2]} {best[0][0]}", file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build app and run app tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Tide.xcodeproj \
            -scheme Tide \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*Tide/|✔|✘|recorded an issue|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Take screenshots
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=build/Build/Products/Debug-iphonesimulator/Tide.app
          mkdir -p screenshots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"

          shoot() {
            local name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -demo YES "$@"
            sleep 7
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }

          for look in dark light; do
            xcrun simctl ui "$UDID" appearance "$look"
            shoot "$look-01-home" -tab home
            shoot "$look-02-add" -tab home -quickadd YES
            shoot "$look-03-activity" -tab activity
            shoot "$look-04-transaction" -tab activity -detail YES
            shoot "$look-05-places" -tab activity -activity places
            shoot "$look-06-settings" -tab home -sheet settings
            shoot "$look-07-categories" -tab home -sheet categories
            shoot "$look-08-home-every-euro" -tab home -mode everyDollar
            shoot "$look-09-plan" -tab plan
            shoot "$look-10-plan-every-euro" -tab plan -mode everyDollar
          done
          ls -la screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'push'
        run: |
          BRANCH_DIR="${GITHUB_REF_NAME//\//-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-screenshots:ci-screenshots 2>/dev/null || true
          if git show-ref --quiet refs/heads/ci-screenshots; then
            git worktree add shots ci-screenshots
          else
            git worktree add --detach shots
            (cd shots && git checkout --orphan ci-screenshots && git rm -rf --quiet . )
          fi
          rm -rf "shots/$BRANCH_DIR"
          mkdir -p "shots/$BRANCH_DIR"
          cp screenshots/*.png "shots/$BRANCH_DIR/"
          cd shots
          git add -A
          git commit -m "Screenshots for $GITHUB_REF_NAME @ ${GITHUB_SHA::7}" || exit 0
          # GitHub occasionally times out; retry, and never fail a green build over screenshots.
          for attempt in 1 2 3 4; do
            if git push origin ci-screenshots; then exit 0; fi
            sleep $((attempt * 15))
            git pull --rebase origin ci-screenshots || true
          done
          echo "::warning::Could not publish screenshots to ci-screenshots (they're still attached to this run)."

      - name: Create release tags
        if: github.event_name == 'push'
        # GitHub doesn't let the workflow token tag commits that contain workflow
        # files, so this may only warn. Tags can be created on the Releases page.
        continue-on-error: true
        run: |
          # Tags listed in .github/release-tags.txt ("v0.1.0 <commit>") are created once.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --quiet origin
          grep -vE '^\s*(#|$)' .github/release-tags.txt | while read -r tag commit; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"
            elif git cat-file -e "$commit^{commit}" 2>/dev/null; then
              git tag -a "$tag" "$commit" -m "Tide ${tag#v}"
              if git push origin "$tag"; then
                echo "Created $tag at $commit"
              else
                echo "::warning::Could not push $tag. Create it on GitHub: Releases → Draft a new release → tag $tag, target $commit."
              fi
            else
              echo "::warning::$tag points at unknown commit $commit"
            fi
          done
